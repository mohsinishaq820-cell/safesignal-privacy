<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — SafeSignal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--navy-deep:#0F1B2D;--navy-mid:#16283F;--navy-line:#28405C;--brass:#C89B3C;--brass-soft:#E4C77A;--paper:#F2EDE3;--paper-dim:#B9C2CE;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--navy-deep);color:var(--paper);font-family:'Public Sans',sans-serif;line-height:1.7;}
  h1{font-family:'Fraunces',serif;font-weight:600;}
  a{color:var(--brass-soft);}
  .wrap{max-width:720px;margin:0 auto;padding:0 24px;}
  nav{padding:26px 0;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--navy-line);}
  .brand{font-family:'Fraunces',serif;font-weight:700;font-size:1.1rem;text-decoration:none;color:var(--paper);}
  article{padding:60px 0 90px;}
  article h1{font-size:2.3rem;margin:0 0 20px;}
  article p{color:var(--paper-dim);margin-bottom:14px;max-width:500px;}
  .contact-box{background:var(--navy-mid);border:1px solid var(--navy-line);border-radius:10px;padding:28px;margin-top:24px;}
  .contact-box p{margin-bottom:8px;}
  .contact-box strong{color:var(--paper);}
</style>
</head>
<body>
<div class="wrap">
  <nav><a href="safesignal.html" class="brand">SafeSignal</a><a href="safesignal.html">← Home</a></nav>
  <article>
    <h1>Contact Us</h1>
    <p>Questions, feedback, or a topic you'd like covered in a future guide — we'd like to hear it.</p>
    <div class="contact-box">
      <p><strong>Email:</strong> whoop1518@gmail.com</p>
      <p><strong>Response time:</strong> We typically reply within 2–3 business days.</p>
    </div>
  </article>
</div>
</body>
</html>
